<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <title>مساعد البنك</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="logo">🏦</span>
      <div>
        <b id="gameName">مساعد البنك</b>
        <small id="gameSub"></small>
      </div>
    </div>
    <button class="icon-btn" id="undoBtn" title="تراجع عن آخر عملية">↩︎ تراجع</button>
  </header>

  <main id="view"></main>

  <button class="fab" id="calcBtn" title="الآلة الحاسبة">🧮</button>

  <nav class="tabs">
    <button data-tab="players" class="active"><span>👥</span>اللاعبين</button>
    <button data-tab="props"><span>🃏</span>البطاقات</button>
    <button data-tab="log"><span>📜</span>السجل</button>
    <button data-tab="more"><span>⚙️</span>المزيد</button>
  </nav>

  <div class="overlay" id="sheetOverlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="overlay calc-overlay" id="calcOverlay">
    <div class="sheet calc">
      <div class="calc-expr" id="calcExpr"></div>
      <div class="calc-res" id="calcRes">0</div>
      <div class="calc-keys" id="calcKeys"></div>
      <div class="row">
        <button class="btn" id="calcUse">استخدم الرقم</button>
        <button class="btn ghost" id="calcClose">إغلاق</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
