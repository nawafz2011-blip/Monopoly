<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3326">
  <title>مساعد البنك</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16">
  <script>
    // يعرف الجهاز قبل لا تنرسم الصفحة: phone / tablet / laptop
    (function () {
      var ua = navigator.userAgent, touch = navigator.maxTouchPoints || 0, d = 'auto';
      try { d = localStorage.getItem('bankhelper:device') || 'auto'; } catch (e) {}
      var auto;
      if (/iPad/.test(ua) || (/Macintosh/.test(ua) && touch > 1) || (/Android/.test(ua) && !/Mobile/.test(ua)) || /Tablet|Silk|Kindle/.test(ua)) auto = 'tablet';
      else if (/iPhone|iPod|Android.*Mobile|Windows Phone|Mobile/.test(ua)) auto = 'phone';
      else if (touch > 0 && Math.min(screen.width, screen.height) < 600) auto = 'phone';
      else auto = 'laptop';
      window.AUTO_DEVICE = auto;
      document.documentElement.dataset.device = d === 'auto' ? auto : d;
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="logo" data-ic="bank"></span>
      <div>
        <b id="gameName">مساعد البنك</b>
        <small id="gameSub"></small>
      </div>
    </div>
    <div class="top-btns">
      <button class="icon-btn" id="calcBtn" title="الآلة الحاسبة"><span data-ic="calc"></span></button>
      <button class="icon-btn" id="undoBtn" title="تراجع عن آخر عملية"><span data-ic="undo"></span>تراجع</button>
    </div>
  </header>

  <main id="view"></main>


  <nav class="tabs">
    <button data-tab="players" class="active"><span data-ic="users"></span>اللاعبين<kbd hidden>1</kbd></button>
    <button data-tab="props"><span data-ic="card"></span>البطاقات<kbd hidden>2</kbd></button>
    <button data-tab="log"><span data-ic="list"></span>السجل<kbd hidden>3</kbd></button>
    <button data-tab="more"><span data-ic="settings"></span>المزيد<kbd hidden>4</kbd></button>
    <div class="kbd-hint"><span data-ic="keyboard"></span> اختصارات:<br>1 – 4 التبويبات<br>Ctrl+Z تراجع<br>C الآلة الحاسبة<br>Esc إغلاق</div>
  </nav>

  <div class="overlay" id="sheetOverlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="overlay calc-overlay" id="calcOverlay">
    <div class="sheet calc">
      <div class="calc-expr" id="calcExpr"></div>
      <div class="calc-res" id="calcRes">0</div>
      <div class="calc-keys" id="calcKeys"></div>
      <div class="row">
        <button class="btn" id="calcUse">استخدم الرقم</button>
        <button class="btn ghost" id="calcClose">إغلاق</button>
      </div>
    </div>
  </div>

  <div class="overlay instr-overlay" id="instrOverlay">
    <div class="instr" id="instrBox"></div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="importInput" hidden>

  <script src="icons.js?v=16"></script>
  <script src="data.js?v=16"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
